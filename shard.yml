name: watermark
version: 0.1.5

description: |
  Add text watermarks to PDF and image files (PNG, JPEG). Pure Crystal,
  zero external tool dependency. Inspired by filigrane.beta.gouv.fr —
  designed to mark identity documents and confidential files before
  transmission, with diagonal, tiled, header/footer and centered
  styles.

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

# Pour le développement local, remplacer par :
#   pdf:
#     path: ../pdf
dependencies:
  pdf:
    github: aloli-crystal/pdf
    version: "~> 1.6"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  watermark:
    main: src/cli.cr

crystal: ">= 1.19.0"
